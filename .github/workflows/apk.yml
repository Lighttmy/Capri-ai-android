name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compilar
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "^e: |error:|What went wrong|Caused by|FAILED|Could not|AndroidX|licen" build.log | head -25 | while IFS= read -r l; do echo "::error title=gradle::${l:0:400}"; done
            tail -n 15 build.log | while IFS= read -r l; do echo "::warning title=fin-log::${l:0:300}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: AsistenteIA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AsistenteIA.apk
          gh release delete apk-ultimo --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-ultimo AsistenteIA.apk --title "APK (última compilación)" --notes "APK de depuración del Asistente IA. Instálalo en el móvil permitiendo apps de origen desconocido."
